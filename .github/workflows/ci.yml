name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# only keep the newest run per ref alive, cancel stale ones
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SQLite path + every bit of pure logic, across all supported Node versions. no database
  # here => the postgres backed vitest files self-skip without DATABASE_URL, so the whole
  # matrix runs concurrently without fighting over one shared `swaptest` schema
  test:
    runs-on: ubuntu-latest
    strategy:
      # one failing Node version shouldn't cancel the others => easier to see if it's version specific
      fail-fast: false
      matrix:
        # 22 & 24 are the live LTS/current lines. 18 & 20 are both past Node's EOL now, and
        # vitest 4's rolldown bundler imports `styleText` from node:util (node 20.12+ only), so
        # the runner can't even boot on 18 => testing them was permanently red, not real coverage.
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm version is pinned via package.json "packageManager", so action-setup,
      # corepack & local dev all agree. bumping it is a deliberate one-line change.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build (dual CJS/ESM + d.ts)
        run: pnpm run build

      # postgres files skip themselves with no DATABASE_URL => this is the SQLite + logic pass
      - name: Unit tests (Vitest)
        run: pnpm run test

      - name: Smoke test (SQLite, no DB needed)
        run: pnpm run smoke

  # Biome lint + format gate. no DB, no build => the fastest signal on a PR. `biome ci` is the
  # non-writing CI mode: it fails on any lint error or unformatted file, so a reflow that never ran
  # locally can't slip in. mirrors `pnpm run check` (prepublishOnly) so local & CI agree
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint + format check (Biome)
        run: pnpm exec biome ci .

  # TSDoc has to stay warning clean (typedoc.json treatWarningsAsErrors) => catch a broken
  # {@link} or an undocumented public symbol here, on the PR, not after it merges & the Pages
  # deploy (docs.yml) is the first thing to notice
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate docs (fails on any TypeDoc warning)
        run: pnpm run docs

  # the postgres backed tests all hit one shared neon database, so they run in a single job on
  # one Node version => no two jobs create & drop the same `swaptest*` schema at the same time.
  # takes the url from a repo secret & self-skips (exit 0 / skipIf) when it's empty, so fork PRs
  # without the secret stay green instead of hard failing
  postgres:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # coverage is generated here, inside the DATABASE_URL job => this is the only run that
      # exercises the pg runtime paths & the down swap, so its numbers are the truest picture. the
      # text-summary reporter drops the table straight into the job log. on a fork PR with no
      # secret the pg tests self-skip, coverage still writes for the SQLite + logic pass
      - name: Integration tests + coverage (Vitest incl. postgres files, real database)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm run test:coverage
          pnpm run swap-test

      # surface the totals on the run summary page too, not just buried in the log. reads the
      # json-summary reporter's output => no extra action, no artifact upload (keeps the workflow
      # off the deprecated Node 20 upload-artifact). a skipped coverage run just prints a note
      - name: Coverage summary to run page
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const p = "coverage/coverage-summary.json";
            if (!fs.existsSync(p)) { console.log("no coverage summary (run skipped?)"); process.exit(0); }
            const t = JSON.parse(fs.readFileSync(p, "utf8")).total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            const md = [
              "## Coverage (src/)",
              "",
              "| metric | % | covered/total |",
              "| --- | --- | --- |",
              row("lines"), row("statements"), row("functions"), row("branches"),
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
          '
