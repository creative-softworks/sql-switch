<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">sql-switch</title>
  <desc id="heroDesc">One fluent API for your data — SQLite in dev, PostgreSQL in prod, with a one-command engine swap between them.</desc>

  <defs>
    <linearGradient id="swapArrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56d4dd"/>
      <stop offset="1" stop-color="#7c8cff"/>
    </linearGradient>
  </defs>

  <!-- canvas: self-supplied background so it reads on light + dark GitHub themes -->
  <rect x="0" y="0" width="1200" height="340" rx="20" fill="#0b0f14"/>
  <rect x="1" y="1" width="1198" height="338" rx="19" fill="none" stroke="#1c232c" stroke-width="2"/>
  <line x1="672" y1="52" x2="672" y2="288" stroke="#1c232c" stroke-width="2"/>

  <!-- LEFT: identity -->
  <g transform="translate(64 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="2" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="3" fill="#8b949e">UNIVERSAL · HOT-SWAPPABLE · ZERO LOCK-IN</text>

    <text x="0" y="162" font-size="90" font-weight="800" fill="#e6edf3">sql<tspan fill="#3fb950">-switch</tspan></text>

    <text x="2" y="212" font-size="27" fill="#c9d1d9">One fluent API. SQLite in dev,</text>
    <text x="2" y="248" font-size="27" fill="#8b949e">PostgreSQL in prod, one-command swap.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#8b949e">
      <text x="2" y="304">npm 1.0.1</text>
      <text x="150" y="304" fill="#30363d">·</text>
      <text x="170" y="304">MIT</text>
      <text x="232" y="304" fill="#30363d">·</text>
      <text x="252" y="304">node ≥ 22</text>
      <text x="378" y="304" fill="#30363d">·</text>
      <text x="398" y="304">TypeScript</text>
    </g>
  </g>

  <!-- RIGHT: the swap motif — same call, both engines -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- shared call chip -->
    <rect x="760" y="64" width="330" height="48" rx="12" fill="#0e141b" stroke="#3fb950" stroke-width="2"/>
    <text x="925" y="94" text-anchor="middle" font-size="19" fill="#e6edf3">.key(id)<tspan fill="#3fb950">.set(v)</tspan></text>

    <!-- branch connectors from chip to both engine cards -->
    <path d="M925 112 V138 H806 V166" fill="none" stroke="#2a313c" stroke-width="2"/>
    <path d="M925 112 V138 H1044 V166" fill="none" stroke="#2a313c" stroke-width="2"/>

    <!-- SQLite card -->
    <rect x="712" y="168" width="188" height="104" rx="14" fill="#11161d" stroke="#2a313c" stroke-width="2"/>
    <rect x="712" y="168" width="6" height="104" rx="3" fill="#56d4dd"/>
    <text x="736" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#56d4dd">SQLite</text>
    <text x="736" y="234" font-size="16" fill="#c9d1d9">local .db file</text>
    <text x="736" y="256" font-size="15" fill="#8b949e">mode: 'local'</text>

    <!-- Postgres card -->
    <rect x="950" y="168" width="188" height="104" rx="14" fill="#11161d" stroke="#2a313c" stroke-width="2"/>
    <rect x="950" y="168" width="6" height="104" rx="3" fill="#7c8cff"/>
    <text x="974" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#7c8cff">PostgreSQL</text>
    <text x="974" y="234" font-size="16" fill="#c9d1d9">cloud schema</text>
    <text x="974" y="256" font-size="15" fill="#8b949e">mode: 'cloud'</text>

    <!-- swap arrow between the two cards -->
    <path d="M905 214 H945" stroke="url(#swapArrow)" stroke-width="2.5" fill="none"/>
    <path d="M905 214 l9 -6 v12 z" fill="#56d4dd"/>
    <path d="M945 214 l-9 -6 v12 z" fill="#7c8cff"/>
    <path d="M905 228 H945" stroke="url(#swapArrow)" stroke-width="2.5" fill="none"/>
    <path d="M945 228 l-9 -6 v12 z" fill="#7c8cff"/>
    <path d="M905 228 l9 -6 v12 z" fill="#56d4dd"/>
    <text x="925" y="296" text-anchor="middle" font-size="16" fill="#3fb950">swapEngine()</text>
  </g>
</svg>
