name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# only keep the newest run per ref alive, cancel stale ones
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must land before setup-node so the `cache: pnpm` store hook resolves
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm 10+ blocks lifecycle scripts by default, so better-sqlite3 & esbuild
      # never fetch/build their native binaries on a plain install => force it here,
      # otherwise smoke (better-sqlite3) and build (esbuild) both blow up at runtime
      - name: Rebuild native modules
        run: pnpm rebuild

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (dual CJS/ESM + d.ts)
        run: pnpm build

      - name: Smoke test (SQLite, no DB needed)
        run: pnpm smoke

      # takes the connection url straight from the repo secret. swap-test creates &
      # drops its own `swaptest` schema, and self-skips (exit 0) if the secret is
      # empty, so fork PRs without the secret stay green instead of hard failing
      - name: Engine swap test (Postgres)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm swap-test
