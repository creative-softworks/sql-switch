name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# only keep the newest run per ref alive, cancel stale ones
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version is pinned via package.json "packageManager", so action-setup,
      # corepack & local dev all agree. bumping it is a deliberate one-line change.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build (dual CJS/ESM + d.ts)
        run: pnpm run build

      - name: Smoke test (SQLite, no DB needed)
        run: pnpm run smoke

      # takes the connection url straight from the repo secret. swap-test creates &
      # drops its own `swaptest` schema, and self-skips (exit 0) if the secret is
      # empty, so fork PRs without the secret stay green instead of hard failing
      - name: Engine swap test (Postgres)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm run swap-test
